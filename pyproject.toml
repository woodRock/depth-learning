[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depth"
version = "0.1.0"
description = "Multimodal deep learning for hydroacoustic fish classification"
readme = "depth/README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.285",
]

[project.scripts]
depth = "depth.main:main"

[tool.hatchling.build.targets.wheel]
packages = ["depth"]

[tool.pytest.ini_options]
pythonpath = ["depth"]
testpaths = ["tests"]
addopts = "-v"
